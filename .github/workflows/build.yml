name: Build ZT9101 Android13 5.15
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git kmod libelf-dev libssl-dev lld llvm clang gcc-aarch64-linux-gnu
      - name: Clone Android 13 5.15 GKI Kernel
        run: |
          git clone --depth=1 -b common-android13-5.15 https://android.googlesource.com/kernel/common kernel-5.15
          cd kernel-5.15
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          scripts/config --disable CONFIG_MODVERSIONS
          scripts/config --disable CONFIG_MODULE_SIG
          scripts/config --disable CONFIG_MODULE_SIG_FORCE
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 LOCALVERSION="-android13-8-00019-gf4321180a397-ab15212794" modules_prepare
      - name: Compile ZT9101 Driver
        run: |
          cd ZT9101_android_V1.2.1800.20241115
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KSRC=$(pwd)/../kernel-5.15 modules
      - uses: actions/upload-artifact@v4
        with:
          name: zt9101-driver-ko
          path: ZT9101_android_V1.2.1800.20241115/*.ko
